## R2 - Part 1 (Assignment 9: DHCP local server + Source NAT)
## Renamed networks per your instructions:
##   Ge-0/0/3 network (192.168.12.0/24) -> "Net3"  [was labelled Net1 on the original diagram]
##   Ge-0/0/4 network (192.168.13.0/24) -> "Net4"  [was labelled Net2 on the original diagram]
##
## Usage on the SRX:
##   configure
##   load override terminal
##   [paste everything below, then Ctrl-D]
##   commit check
##   commit

system {
    host-name R2;
    /* User: root Password: Rootpass */
    root-authentication {
        encrypted-password "$1$xH9xJoL6$MFOUYnZr4.Qj2NM24XInz/"; ## SECRET-DATA
    }
    services {
        dhcp-local-server {
            group LOCAL-CLIENTS {
                interface ge-0/0/3.0;
                interface ge-0/0/4.0;
            }
        }
    }
}

interfaces {
    ge-0/0/2 {
        unit 0 {
            description "Net5 - 10.10.10.0/24 - link to R1";
            family inet {
                address 10.10.10.12/24;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            description "Net3 - 192.168.12.0/24 - PC3";
            family inet {
                address 192.168.12.1/24;
            }
        }
    }
    ge-0/0/4 {
        unit 0 {
            description "Net4 - 192.168.13.0/24 - PC4";
            family inet {
                address 192.168.13.1/24;
            }
        }
    }
    ge-0/0/5 {
        unit 0 {
            description "LabLan - 10.56.16.0/22 - uplink to R3 / Internet";
            family inet {
                address 10.56.16.85/22;
            }
        }
    }
}

routing-options {
    static {
        /* R1's subnets are reached back over the Net5 link */
        route 192.168.10.0/24 next-hop 10.10.10.11;
        route 192.168.11.0/24 next-hop 10.10.10.11;
        /* Default route out to R3 / Internet via LabLan */
        route 0.0.0.0/0 next-hop 10.56.16.1;
    }
}

security {
    zones {
        security-zone Net5 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/2.0;
            }
        }
        security-zone Net3 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/3.0;
            }
        }
        security-zone Net4 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/4.0;
            }
        }
        security-zone LabLan {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/5.0;
            }
        }
    }

    policies {
        from-zone Net3 to-zone Net4 {
            policy permit-net3-to-net4 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net4 to-zone Net3 {
            policy permit-net4-to-net3 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net3 to-zone Net5 {
            policy permit-net3-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net4 to-zone Net5 {
            policy permit-net4-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone Net3 {
            policy permit-net5-to-net3 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone Net4 {
            policy permit-net5-to-net4 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        /* Outbound to the Internet - NAT is applied via the nat stanza below */
        from-zone Net3 to-zone LabLan {
            policy permit-net3-to-lablan {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net4 to-zone LabLan {
            policy permit-net4-to-lablan {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone LabLan {
            policy permit-net5-to-lablan {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone LabLan to-zone Net3 {
            policy permit-lablan-to-net3 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone LabLan to-zone Net4 {
            policy permit-lablan-to-net4 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone LabLan to-zone Net5 {
            policy permit-lablan-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }

    nat {
        source {
            /* Interface-based source NAT: everything leaving toward LabLan/Internet
               is translated to R2's ge-0/0/5 address (10.56.16.85). This covers
               Net3/Net4 traffic AND Net1/Net2 traffic transiting from R1 over Net5. */
            rule-set SNAT-TO-INTERNET {
                from zone [ Net3 Net4 Net5 ];
                to zone LabLan;
                rule SNAT-INTERFACE {
                    match {
                        source-address 0.0.0.0/0;
                    }
                    then {
                        source-nat {
                            interface;
                        }
                    }
                }
            }
        }
    }
}

access {
    address-assignment {
        pool NET3-POOL {
            family inet {
                network 192.168.12.0/24;
                range NET3-RANGE {
                    low 192.168.12.33;
                    high 192.168.12.44;
                }
                dhcp-attributes {
                    router {
                        192.168.12.1;
                    }
                    name-server {
                        8.8.8.8;
                    }
                }
            }
        }
        pool NET4-POOL {
            family inet {
                network 192.168.13.0/24;
                range NET4-RANGE {
                    low 192.168.13.55;
                    high 192.168.13.66;
                }
                dhcp-attributes {
                    router {
                        192.168.13.1;
                    }
                    name-server {
                        8.8.8.8;
                    }
                }
            }
        }
    }
}
