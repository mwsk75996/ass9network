## R2 - Part 2 (DHCP relay lab): R2 no longer runs a local DHCP server.
## It relays DHCP requests arriving on Net3 (ge-0/0/3.0) and Net4 (ge-0/0/4.0)
## to R1's DHCP server at 10.10.10.11, over the Net5 link.
##
## Everything below is identical to R2's Part 1 config EXCEPT:
##   - "system services dhcp-local-server" and the NET3-POOL/NET4-POOL
##     address-assignment pools are REMOVED (R2 is no longer the server)
##   - "forwarding-options dhcp-relay" is ADDED to relay Net3/Net4 requests
##     to R1
##   - Source NAT and routing are unchanged from Part 1
##
## Usage on the SRX:
##   configure
##   load override terminal
##   [paste everything below, then Ctrl-D]
##   commit check
##   commit

system {
    host-name R2;
    /* User: root Password: Rootpass */
    root-authentication {
        encrypted-password "$1$xH9xJoL6$MFOUYnZr4.Qj2NM24XInz/"; ## SECRET-DATA
    }
}

interfaces {
    ge-0/0/2 {
        unit 0 {
            description "Net5 - 10.10.10.0/24 - link to R1 (also carries relayed DHCP)";
            family inet {
                address 10.10.10.12/24;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            description "Net3 - 192.168.12.0/24 - PC3";
            family inet {
                address 192.168.12.1/24;
            }
        }
    }
    ge-0/0/4 {
        unit 0 {
            description "Net4 - 192.168.13.0/24 - PC4";
            family inet {
                address 192.168.13.1/24;
            }
        }
    }
    ge-0/0/5 {
        unit 0 {
            description "LabLan - 10.56.16.0/22 - uplink to R3 / Internet";
            family inet {
                address 10.56.16.85/22;
            }
        }
    }
}

routing-options {
    static {
        route 192.168.10.0/24 next-hop 10.10.10.11;
        route 192.168.11.0/24 next-hop 10.10.10.11;
        route 0.0.0.0/0 next-hop 10.56.16.1;
    }
}

forwarding-options {
    dhcp-relay {
        server-group R1-DHCP-SERVER {
            10.10.10.11;
        }
        group RELAY-NET3-NET4 {
            active-server-group R1-DHCP-SERVER;
            interface ge-0/0/3.0;
            interface ge-0/0/4.0;
        }
    }
}

security {
    zones {
        security-zone Net5 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/2.0;
            }
        }
        security-zone Net3 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/3.0;
            }
        }
        security-zone Net4 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/4.0;
            }
        }
        security-zone LabLan {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/5.0;
            }
        }
    }

    policies {
        from-zone Net3 to-zone Net4 {
            policy permit-net3-to-net4 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net4 to-zone Net3 {
            policy permit-net4-to-net3 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net3 to-zone Net5 {
            policy permit-net3-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net4 to-zone Net5 {
            policy permit-net4-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone Net3 {
            policy permit-net5-to-net3 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone Net4 {
            policy permit-net5-to-net4 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net3 to-zone LabLan {
            policy permit-net3-to-lablan {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net4 to-zone LabLan {
            policy permit-net4-to-lablan {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone LabLan {
            policy permit-net5-to-lablan {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone LabLan to-zone Net3 {
            policy permit-lablan-to-net3 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone LabLan to-zone Net4 {
            policy permit-lablan-to-net4 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone LabLan to-zone Net5 {
            policy permit-lablan-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }

    nat {
        source {
            rule-set SNAT-TO-INTERNET {
                from zone [ Net3 Net4 Net5 ];
                to zone LabLan;
                rule SNAT-INTERFACE {
                    match {
                        source-address 0.0.0.0/0;
                    }
                    then {
                        source-nat {
                            interface;
                        }
                    }
                }
            }
        }
    }
}
