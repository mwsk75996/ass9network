## R1 - Part 1 (Assignment 9: DHCP local server + Source NAT)
## Renamed networks per your instructions:
##   Ge-0/0/1 network (192.168.10.0/24) -> "Net1"  [was labelled Net3 on the original diagram]
##   Ge-0/0/2 network (192.168.11.0/24) -> "Net2"  [was labelled Net4 on the original diagram]
##
## Usage on the SRX:
##   configure
##   load override terminal
##   [paste everything below, then Ctrl-D]
##   commit check
##   commit

system {
    host-name R1;
    /* User: root Password: Rootpass */
    root-authentication {
        encrypted-password "$1$xH9xJoL6$MFOUYnZr4.Qj2NM24XInz/"; ## SECRET-DATA
    }
    services {
        dhcp-local-server {
            group LOCAL-CLIENTS {
                interface ge-0/0/1.0;
                interface ge-0/0/2.0;
            }
        }
    }
}

interfaces {
    ge-0/0/1 {
        unit 0 {
            description "Net1 - 192.168.10.0/24 - PC1";
            family inet {
                address 192.168.10.1/24;
            }
        }
    }
    ge-0/0/2 {
        unit 0 {
            description "Net2 - 192.168.11.0/24 - PC2";
            family inet {
                address 192.168.11.1/24;
            }
        }
    }
    ge-0/0/3 {
        unit 0 {
            description "Net5 - 10.10.10.0/24 - link to R2";
            family inet {
                address 10.10.10.11/24;
            }
        }
    }
}

routing-options {
    static {
        /* Default route: everything not local goes to R2, which owns the LabLan/Internet exit */
        route 0.0.0.0/0 next-hop 10.10.10.12;
    }
}

security {
    zones {
        security-zone Net1 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/1.0;
            }
        }
        security-zone Net2 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/2.0;
            }
        }
        security-zone Net5 {
            host-inbound-traffic {
                system-services {
                    all;
                }
                protocols {
                    all;
                }
            }
            interfaces {
                ge-0/0/3.0;
            }
        }
    }

    policies {
        from-zone Net1 to-zone Net2 {
            policy permit-net1-to-net2 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net2 to-zone Net1 {
            policy permit-net2-to-net1 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net1 to-zone Net5 {
            policy permit-net1-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net2 to-zone Net5 {
            policy permit-net2-to-net5 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone Net1 {
            policy permit-net5-to-net1 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
        from-zone Net5 to-zone Net2 {
            policy permit-net5-to-net2 {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    permit;
                }
            }
        }
    }
}

access {
    address-assignment {
        pool NET1-POOL {
            family inet {
                network 192.168.10.0/24;
                range NET1-RANGE {
                    low 192.168.10.15;
                    high 192.168.10.20;
                }
                dhcp-attributes {
                    router {
                        192.168.10.1;
                    }
                    name-server {
                        8.8.8.8;
                    }
                }
            }
        }
        pool NET2-POOL {
            family inet {
                network 192.168.11.0/24;
                range NET2-RANGE {
                    low 192.168.11.22;
                    high 192.168.11.32;
                }
                dhcp-attributes {
                    router {
                        192.168.11.1;
                    }
                    name-server {
                        8.8.8.8;
                    }
                }
            }
        }
    }
}
